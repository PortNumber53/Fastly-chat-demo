version: "3.8"

services:
  chat-demo:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - FASTLY_FANOUT_ENABLED=${FASTLY_FANOUT_ENABLED:-false}
      - FASTLY_GRIP_URL=${FASTLY_GRIP_URL:-}
      - FASTLY_GRIP_KEY=${FASTLY_GRIP_KEY:-}
      - FASTLY_FANOUT_DOMAIN=${FASTLY_FANOUT_DOMAIN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
