# Fastly Compute@Edge Package Configuration
# This file configures the project for deployment to Fastly Compute@Edge
# with Fanout for real-time message delivery

manifest_version = 2
name = "fastly-chat-demo"
language = "go"

[setup]
  [setup.backends]
    [setup.backends.chat_server]
      address = "127.0.0.1:8080"
      port = 8080

  [setup.dictionaries]
    [setup.dictionaries.config]
      description = "Chat demo configuration"

  [setup.log_endpoints]
    [setup.log_endpoints.fanout]
      name = "fanout"
